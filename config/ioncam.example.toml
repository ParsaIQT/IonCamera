# ioncam configuration

# Camera hardware
[camera]
# 'andor' (real iXon via pyAndorSDK2), 'simulator' (physics simulator) or 'fake_sdk' (andor driver on an emulated SDK - for testing the driver itself)
backend = "andor"
# directory passed to Initialize(); '' = SDK default
sdk_dir = ""
# which camera to use if several are connected
camera_index = 0
# sensor set point [deg C]
target_temperature = -60
# switch the TEC cooler on at start-up
cooler_on = true
# keep the sensor cold after the server exits (SetCoolerMode(1)); avoids thermal cycling
keep_cooler_on_exit = true
# 0 = full, 1 = low, 2 = off (only with water cooling!)
fan_mode = 0
# EM gain mode: 0 = DAC 0-255, 1 = DAC 0-4095, 2 = linear, 3 = real EM gain (what Solis shows for the iXon Ultra)
em_gain_mode = 3
# allow EM gains above 300 (ages the sensor; photon counting only)
em_advanced = false
# shutter: 'open' (permanently), 'closed', 'auto' (opens and closes around every exposure: at most ~2 Hz on an iXon Ultra, not for video) or 'series' (open while acquiring)
shutter = "open"
# the external shutter output (Shutter TTL of the I/O connector), on cameras that control it separately: same choices
external_shutter = "open"
# the shutter output goes high to open
shutter_ttl_high = true
# shutter opening time [ms] (Andor: 0 when permanently open, 27 for an iXon Ultra in 'auto')
shutter_open_ms = 0
# shutter closing time [ms]
shutter_close_ms = 0
# electrons per count of your camera at the readout speed and pre-amp gain in use (its System Performance Sheet), for the brightness in photoelectrons/s; 0 = ask the camera (GetSensitivity)
sensitivity = 0.0
# how often to read the temperature [s]
temperature_poll_s = 2.0

# Live video (trapping, monitoring): settings for internal-trigger video
[live]
# exposure time [s]
exposure = 0.05
# EM gain (in camera.em_gain_mode units); 0 = minimum
em_gain = 50
# 'em' or 'conventional' output amplifier
amplifier = "em"
# horizontal readout rate [MHz]; the nearest available (by ratio) is used - 5 MHz is 10 MHz on an iXon Ultra 888 (30, 20, 10, 1 MHz)
hs_speed_mhz = 10.0
# vertical shift speed [us]; 0 = the camera's fastest recommended one (iXon Ultra 888: 1.13 us).  Faster ones are used only with vs_amplitude > 0: at normal voltage they garble the image (an 888 at 0.6 us)
vs_speed_us = 0.0
# vertical clock voltage: 0 = Normal, 1..4 = +1..+4
vs_amplitude = 0
# pre-amp gain index (0-based; Solis 'Gain 3' = 2); -1 = the highest the camera offers at this readout speed (897: Gain 3, 888: Gain 2)
preamp_gain_index = -1
# keep the baseline (bias) level constant
baseline_clamp = true
# horizontal binning
hbin = 1
# vertical binning
vbin = 1
# acquisition ROI [x0, y0, x1, y1] (0-based, half-open, raw sensor orientation); omit = full sensor
# roi = 
# internal | external | external_start | external_exposure | software
trigger = "internal"
# single | run_till_abort | accumulate
acquisition = "run_till_abort"
# number of accumulations (acquisition = accumulate)
n_accumulations = 1
# frame-transfer readout (no dead time between frames)
frame_transfer = true
# accept external triggers without finishing a keep-clean cycle
fast_ext_trigger = false
# trigger on the falling edge
trigger_invert = false
# also stream frames out of the Camera Link port (Grabber)
camera_link = false
# frame period for internal trigger [s]; 0 = fastest
kinetic_cycle_time = 0.0

# Long-exposure, low-gain frames used to locate the ions precisely
[locate]
# exposure time [s]
exposure = 0.5
# EM gain (in camera.em_gain_mode units); 0 = minimum
em_gain = 10
# 'em' or 'conventional' output amplifier
amplifier = "em"
# horizontal readout rate [MHz]; the nearest available (by ratio) is used - 5 MHz is 10 MHz on an iXon Ultra 888 (30, 20, 10, 1 MHz)
hs_speed_mhz = 5.0
# vertical shift speed [us]; 0 = the camera's fastest recommended one (iXon Ultra 888: 1.13 us).  Faster ones are used only with vs_amplitude > 0: at normal voltage they garble the image (an 888 at 0.6 us)
vs_speed_us = 0.0
# vertical clock voltage: 0 = Normal, 1..4 = +1..+4
vs_amplitude = 0
# pre-amp gain index (0-based; Solis 'Gain 3' = 2); -1 = the highest the camera offers at this readout speed (897: Gain 3, 888: Gain 2)
preamp_gain_index = -1
# keep the baseline (bias) level constant
baseline_clamp = true
# horizontal binning
hbin = 1
# vertical binning
vbin = 1
# acquisition ROI [x0, y0, x1, y1] (0-based, half-open, raw sensor orientation); omit = full sensor
# roi = 
# internal | external | external_start | external_exposure | software
trigger = "internal"
# single | run_till_abort | accumulate
acquisition = "run_till_abort"
# number of accumulations (acquisition = accumulate)
n_accumulations = 1
# frame-transfer readout (no dead time between frames)
frame_transfer = true
# accept external triggers without finishing a keep-clean cycle
fast_ext_trigger = false
# trigger on the falling edge
trigger_invert = false
# also stream frames out of the Camera Link port (Grabber)
camera_link = false
# frame period for internal trigger [s]; 0 = fastest
kinetic_cycle_time = 0.0

# Grabber readout (external trigger + Camera Link).  AQROI is computed automatically; the roi field here is ignored
[readout]
# exposure time [s]
exposure = 0.0015
# EM gain (in camera.em_gain_mode units); 0 = minimum
em_gain = 200
# 'em' or 'conventional' output amplifier
amplifier = "em"
# horizontal readout rate [MHz]; the nearest available (by ratio) is used - 5 MHz is 10 MHz on an iXon Ultra 888 (30, 20, 10, 1 MHz)
hs_speed_mhz = 5.0
# vertical shift speed [us]; 0 = the camera's fastest recommended one (iXon Ultra 888: 1.13 us).  Faster ones are used only with vs_amplitude > 0: at normal voltage they garble the image (an 888 at 0.6 us)
vs_speed_us = 0.0
# vertical clock voltage: 0 = Normal, 1..4 = +1..+4
vs_amplitude = 0
# pre-amp gain index (0-based; Solis 'Gain 3' = 2); -1 = the highest the camera offers at this readout speed (897: Gain 3, 888: Gain 2)
preamp_gain_index = -1
# keep the baseline (bias) level constant
baseline_clamp = true
# horizontal binning
hbin = 4
# vertical binning
vbin = 4
# acquisition ROI [x0, y0, x1, y1] (0-based, half-open, raw sensor orientation); omit = full sensor
# roi = 
# internal | external | external_start | external_exposure | software
trigger = "external"
# single | run_till_abort | accumulate
acquisition = "run_till_abort"
# number of accumulations (acquisition = accumulate)
n_accumulations = 1
# frame-transfer readout (no dead time between frames)
frame_transfer = false
# accept external triggers without finishing a keep-clean cycle
fast_ext_trigger = false
# trigger on the falling edge
trigger_invert = false
# also stream frames out of the Camera Link port (Grabber)
camera_link = true
# frame period for internal trigger [s]; 0 = fastest
kinetic_cycle_time = 0.0

# How the readout calibration (locate -> plan -> verify -> arm) works
[calibration]
# long-exposure frames averaged to locate the ions
n_frames = 2
# if > 0 and ions are already known, only acquire this many px around them (faster); 0 = full sensor/live ROI
search_margin = 0
# if > 0, calibration fails unless exactly this many ions are found
expected_ions = 0
# Grabber ROI size per ion in super-pixels (binned px) [w, h].  [1, 1]: one super-pixel per ion, the binning grid placed so the ions sit at their centres - the fewest pixels, so the fewest dark counts per ROI: usually the best state discrimination.  [0, 0]: as much of each ion's light as the grid allows (bigger ROIs, more dark counts)
roi_size = [1, 1]
# required fraction of each ion's light inside its ROI (PSF halo included: real optics rarely give > 85 %)
min_containment = 0.6
# maximum fraction of an ion's light in a neighbour's ROI
max_crosstalk = 0.12
# binned pixels of margin around the ROIs in the AQROI
frame_margin = 1
# add one extra Grabber ROI on empty background
background_roi = true
# also give dark ions known to the tracker a ROI
include_dark_sites = true
# take test frames with the final readout settings (internal trigger) and check every ROI before arming
verify = true
# number of verification frames (also the shots of the quick fidelity estimate until triggered shots arrive)
verify_frames = 200
# minimum significance of each ion's mean signal over the verification frames (is it in its ROI?)
min_verify_snr = 5.0
# joint 2D Gaussian fit of all ions (sub-pixel positions, PSF)
fit_psf = true

# While armed: is the crystal still there?  The averaged readout frames tell an ion dark, an ion lost (the others re-arranged) or no ion light
[readout_check]
# while armed, check the crystal from the averaged readout frames: an ion dark, lost, no ion light (events)
enabled = true
# readout shots averaged
window = 1000
# the most recent shots checked on their own as well, to see a change within the window sooner; 0 = a quarter of the window
recent = 0
# check every this many shots
every = 100
# checks in a row that must agree before an event
confirm = 2
# an ion with less than this fraction of the other ions' light (each against its own after arming) is dark
dark_level = 0.15
# relative accuracy of the PSF model per super-pixel
systematic = 0.05
# how much better (chi-square) a crystal of fewer ions must fit the light before an ion is called lost
margin = 16.0

# Camera characterization: dark frames at many readout settings with the shutter closed (CIC, read noise, EM gain, dark current) and the SPAM error each setting gives
[characterize]
# what the camera characterization measures (with the shutter closed): baseline, sensor, electronics, vertical, gain, exposure, binning, triggered, conventional, grid, temperature
stages = ["baseline", "sensor", "electronics", "vertical", "gain", "exposure", "binning", "triggered", "conventional", "grid"]
# side of the square sensor region measured [px]; centred on the readout AQROI, else the ions, else the sensor (144 suits every binning up to 8 and 9)
region_size = 144
# pixel samples aimed for at every setting (frames x super-pixels): the rare events of the dark distribution's tail need millions
samples_per_point = 3000000
# fewest frames per setting
min_frames = 60
# most frames per setting
max_frames = 5000
# longest acquisition per setting [s]
max_point_s = 20.0
# frames after every start that are analysed separately (the first frames of an acquisition can differ)
discard_frames = 2
# EM gains of the gain sweep (those the camera allows)
em_gains = [1, 2, 5, 10, 20, 50, 100, 150, 200, 300, 500, 700, 1000]
# exposures of the exposure sweep [ms]; the long ones measure dark current and light leaks
exposures_ms = [0.1, 0.2, 0.5, 1.0, 1.5, 2.0, 3.0, 5.0, 7.0, 10.0, 30.0, 100.0, 300.0, 1000.0]
# square on-chip binnings measured (the readout's is added)
binnings = [1, 2, 3, 4, 6, 8]
# software-triggered single shots with this idle time between them [ms], like Grabber readout shots (0 = as fast as possible)
trigger_spacings_ms = [0.0, 2.0, 10.0, 100.0, 1000.0]
# EM gains of the full grid (HS speed x pre-amp x VS speed x clock voltage); 0 = the readout's, above the camera's maximum = its maximum
grid_gains = [0, 9999]
# vertical clock voltages measured (0 = normal, 1..4 = +1..+4); empty = all the camera has
vs_amplitudes = []
# sensor set points of the temperature stage [C], e.g. [-60, -70, -80]
temperatures = []
# longest wait for the temperature to settle [s]
temperature_timeout_s = 900.0
# repeat the baseline setting this often [s] (bias, CIC and temperature drift)
stability_every_s = 600.0
# for the SPAM ranking: photo-electrons/s from one bright ion (all its light); 0 = the brightness measured live
ion_rate = 0.0
# fraction of an ion's light in its readout ROI; 0 = from the readout plan, else 0.6
roi_fraction = 0.0
# super-pixels summed per ion
roi_pixels = 1
# stray light in an ion's ROI [photo-electrons/s]
background_rate = 0.0
# detection times shown in the ranking [ms]
detection_ms = [0.5, 1.0, 1.5, 2.0, 3.0, 5.0, 10.0]
# the ranking compares settings by the shortest detection time reaching this SPAM error
target_error = 0.001
# bright state lifetime under the detection light (depumping) [ms]; 0 = ignore
bright_lifetime_ms = 0.0
# dark state lifetime under the detection light (off-resonant pumping) [ms]; 0 = ignore
dark_lifetime_ms = 0.0

# Ion spot detection
[detection]
# PSF Gaussian sigma [sensor px]; refined by calibration if auto_psf
psf_sigma = 1.8
# fraction of an ion's light in a broad halo (aberration wings); refined by calibration if auto_psf
psf_halo_fraction = 0.0
# halo sigma [sensor px]
psf_halo_sigma = 0.0
# update the PSF (core sigma, halo) from calibration fits
auto_psf = true
# fit overlapping ions jointly (dense chains of blurred ions)
deblend = true
# largest group of overlapping ions fitted jointly
deblend_max = 24
# detection threshold in units of the matched-filter noise
threshold_sigma = 6.0
# minimum distance between two ions [sensor px]
min_separation = 2.5
# block size for the smooth background map [sensor px]
background_block = 32
# only look for ions inside [x0, y0, x1, y1] (sensor px); omit = everywhere
# analysis_roi = 
# never report more spots than this
max_spots = 100
# a spot wider than this x PSF is reported as an uncrystallised cloud, not an ion
cloud_width_factor = 2.2
# threshold for faint, diffuse clouds (light the ions do not explain, filtered at cloud scale); 0 = off
cloud_threshold_sigma = 6.0
# maximum full-detection rate (frames beyond are only used for cheap per-ion counts)
max_rate_hz = 40.0
# follow the brightness of the learned static background (laser power) frame by frame
static_scale_tracking = true

# Chain tracking and event classification (trapped / lost / dark)
[tracker]
# a change must persist this long before it is reported [s]
confirm_time = 0.5
# ... and for at least this many analysed frames
confirm_frames = 3
# time without changes before the chain counts as stable [s]
stable_time = 1.0
# max frame-to-frame motion of one ion after removing the common shift [px]
match_radius = 2.0
# largest common translation searched for [px]
max_global_shift = 25.0
# ions moving by more than this fraction of the local spacing => chain reconfigured
reconfig_fraction = 0.25
# ... but by at least this many px
reconfig_min_px = 0.8
# site brightness below this fraction of its reference => dark
dark_level = 0.25
# site brightness above this fraction => bright again
bright_level = 0.55
# total brightness below this fraction (and spots lost) => crystal melted
melt_level = 0.35
# light still around a dim crystal (fraction of its normal light, above the usual scatter) that makes it 'melted' rather than 'dark' / 'lasers off'
melt_diffuse = 0.08
# seconds without any fluorescence before the ions are presumed lost
forget_time = 30.0
# EMA weight used to follow slow drifts
position_smoothing = 0.15
# use the linear-chain equilibrium model to locate dark ions after a reconfiguration
use_chain_model = true
# maximum number of hidden dark ions to infer
max_dark_inferred = 3
# default maximum duration of hold_tracking() [s]
hold_timeout = 120.0
# an ion shines at least this fraction of a typical ion of the crystal (each when lit): a fainter spot next to it - stray light, a reflection - is not counted as an ion; 0 = off
min_ion_fraction = 0.6
# while the crystal is stable, re-measure it on the average of the frames since the last check every this many seconds (dim or dense chains that single frames cannot resolve); 0 = off
verify_period = 2.0
# ion markers are circles holding this fraction of an ion's light (PSF core + halo as measured in the image)
marker_light_fraction = 0.8
# the marker size settles this long after the ion image changes (e.g. refocusing) [s]
marker_settle_time = 5.0

# ARTIQ Grabber geometry
[grabber]
# Grabber x runs opposite to the SDK image x
flip_x = false
# Grabber y runs opposite to the SDK image y
flip_y = false
# Camera Link pixels per binned pixel along x (1: the stream is binned like the USB image; 0: not binned - the binning)
x_scale = 1
# Camera Link pixels per binned pixel along y (0: the binning)
y_scale = 1
# Camera Link pixels before the image in every line (pre-scan)
x_offset = 0
# lines before the image in every frame
y_offset = 0
# ROI engines in the Grabber gateware
roi_engine_count = 16
# coordinate width of the Grabber gateware (max 2**12-1)
res_width = 12

# Sensor protection
[safety]
# protect the EMCCD against overexposure at high EM gain
enabled = true
# pixel value treated as saturated
saturation_counts = 60000
# more saturated pixels than this trips protection
max_saturated_pixels = 25
# EM gain applied when protection trips (0 = minimum)
safe_em_gain = 0
# legacy rule: if > 0, also trip when more than bright_fraction of all pixels exceed this value
bright_counts = 0
# see bright_counts
bright_fraction = 0.7

# Files
[storage]
# where calibrations and the event log are written
data_dir = "ioncam_data"
# save every calibration (image, fit, plan)
save_calibrations = true
# append all events to <data_dir>/events.jsonl
event_log = true

# Optional publishing of live numbers to ARTIQ datasets
[publish]
# ARTIQ master host to publish ioncam.* datasets to (empty = disabled)
master = ""
# ARTIQ master control port
port = 3251
# dataset name prefix
prefix = "ioncam."
# publish interval [s]
interval = 1.0

# GUI defaults
[display]
# display rotation, degrees clockwise (0, 90, 180, 270); display only - never affects ROIs
rotation = 90
# mirror the display horizontally
flip_x = false
# mirror the display vertically
flip_y = false
# pyqtgraph colormap name
colormap = "inferno"
# auto-levels percentiles
level_percentiles = [1.0, 99.95]
# GUI refresh limit
max_fps = 25.0

# Simulated trap + camera (backend = 'simulator' or --simulate)
[simulator]
# simulated camera: '897' (iXon Ultra 897, 512 x 512 px of 16 um) or '888' (iXon Ultra 888, 1024 x 1024 px of 13 um) - sensor, readout speeds and gains
camera_model = "897"
# ions present at start
n_ions = 3
# chain centre [sensor px]
center = [262.0, 168.0]
# chain axis angle w.r.t. sensor x [deg]
axis_angle_deg = 0.0
# rotation of the whole trap in the image about its centre [deg]: chain axis, electrodes, surface defects and laser beam (as if the camera were turned; hot pixels stay on the sensor)
trap_angle_deg = 0.0
# chain length scale l = (e^2/(4 pi eps0 m w_z^2))^(1/3) x M / pixel [px]: 40Ca+ at w_z = 2 pi 1 MHz has l = 4.45 um = 5.6 px at M = 20 and 16 um pixels.  2 ions are 1.26 l apart, 3 ions 1.08 l, 4 ions 0.91 l (inner pair)
length_scale_px = 5.6
# photons/s per bright ion reaching the camera
photon_rate = 13000.0
# sensor quantum efficiency at the fluorescence wavelength (iXon Ultra 897 BV: ~0.6 at 397 nm)
quantum_efficiency = 0.6
# ion image (PSF) core sigma [px]: aberrations, residual motion; much larger than the diffraction limit in practice
psf_sigma = 1.8
# fraction of an ion's light in a broad halo (aberration wings) - this is what makes the crosstalk between neighbouring ROIs large
psf_halo_fraction = 0.15
# halo sigma [px]
psf_halo_sigma = 4.5
# imaging magnification
magnification = 20.0
# camera pixel size [um]; 0 = the camera model's (iXon Ultra 897: 16, 888: 13)
pixel_size_um = 0.0
# collection NA
numerical_aperture = 0.25
# ion height above the trap surface [um].  The camera is focused on the ions, so a point on the surface is a blurred disk of radius h tan(asin NA) M / pixel (19 px with the defaults; small NA x h makes surface defects look like ions)
ion_height_um = 60.0
# trap surface preset: clean | typical | dirty | horrendous; sets scatter_rate ... hot_pixels below ('' = use those values)
surface = ""
# uniform stray light [photons/s/px], also with the lasers off
background_rate = 2.0
# laser light scattered by the trap surface at the beam centre [photons/s/px]; visible in long exposures
scatter_rate = 25.0
# Gaussian scatter profile: sigma along the beam [px]
scatter_sigma_along = 150.0
# sigma across the beam [px] (beam waist / 2 on the camera)
scatter_sigma_across = 30.0
# profile centre relative to the initial chain centre [px]
scatter_offset = [0.0, 0.0]
# laser beam direction w.r.t. sensor x [deg]
beam_angle_deg = 45.0
# scattering defects / dust on the surface, over the whole sensor (only those in the beam are lit)
defects = 25
# median photons/s of a defect in the beam centre
defect_rate = 3000.0
# log-normal sigma of the defect brightness
defect_spread = 1.2
# dust grains stand up to this high above the surface: closer to focus, less blurred
defect_max_height_um = 0.0
# scratches (lines of defects)
scratches = 0
# light from the electrode gaps along the trap axis at the beam centre [photons/s per px of gap]
gap_scatter = 4.0
# distance of the electrode gaps from the trap axis [px]
gap_offset_px = 45.0
# hot pixels
hot_pixels = 8
# median dark current of a hot pixel [e-/s]
hot_pixel_rate = 200.0
# relative cooling/detection laser intensity: the surface scatter scales with it, the fluorescence too (far below saturation)
laser_power = 1.0
# laser intensity noise, relative rms per frame
laser_noise = 0.01
# seed of the surface layout (defects, scratches, hot pixels)
surface_seed = 1
# baseline counts per (binned) pixel
bias = 100.0
# read noise [e-] rms
read_noise_e = 30.0
# electrons per count at the output
sensitivity = 4.0
# clock-induced charge [e-/px/frame] before the EM register (at the fastest recommended vertical shift speed, normal clock voltage)
cic = 0.003
# parallel CIC grows as (vertical shift time / the fastest recommended one) to this power
cic_vs_exponent = 0.5
# parallel CIC x this for every step of vertical clock voltage (+1..+4)
cic_amplitude_factor = 1.6
# serial CIC: electrons per pixel per frame born in the EM register (at EM gain 300, in proportion to the gain); they get only part of the gain
cic_serial = 0.0
# the EM gain the camera really has / the one set (an aged EM register has less)
em_gain_scale = 1.0
# dark current at -80 C [e-/px/s], doubling every 6.3 C warmer (hot pixels come on top)
dark_current = 0.0
# how much the bias differs between readout channels (HS speed, pre-amp gain) [counts rms]
bias_spread = 0.0
# camera_profile.json of a camera characterization: the simulated camera then has the measured bias, read noise, electrons per count, EM gain, CIC and dark current of the nearest measured setting
camera_profile = ""
# ions loaded per second while the oven is on
load_rate = 0.0
# loss probability per ion per second
loss_rate = 0.0
# go-dark probability per bright ion per second
dark_rate = 0.0
# return-to-bright probability per dark ion per second
bright_rate = 0.0
# an experiment's qubit states: the chance that a bright ion is in its dark state in an exposure (drawn afresh for every frame and ion)
qubit_dark_probability = 0.0
# crystal melting events per second
melt_rate = 0.0
# random-walk drift of the trap centre [px/sqrt(s)]
drift_px_per_s = 0.0
# external-trigger rate when nobody triggers (0 = only sim_trigger())
auto_trigger_hz = 0.0
# random seed (-1 = random)
seed = -1
# how the simulated camera puts its frame on Camera Link (sim_grabber_sums): x and y stream pixels per binned pixel (0 = not binned), x and y offset, mirrored in x, in y (0/1)
camera_link = [1, 1, 0, 0, 0, 0]
